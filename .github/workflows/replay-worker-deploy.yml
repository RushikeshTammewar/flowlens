name: Deploy replay worker

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: 'Where to deploy the replay worker'
        required: true
        default: 'aws'
        type: choice
        options:
          - aws
          - azure
      tag:
        description: 'Image tag (default: short SHA)'
        required: false
        default: ''

env:
  IMAGE_NAME: flowlens-replay-worker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(echo $GITHUB_SHA | cut -c1-12)"
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── AWS path ────────────────────────────────────────────
      - name: Configure AWS credentials
        if: ${{ github.event.inputs.cloud == 'aws' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        if: ${{ github.event.inputs.cloud == 'aws' }}
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push to ECR
        if: ${{ github.event.inputs.cloud == 'aws' }}
        uses: docker/build-push-action@v6
        with:
          context: apps/replay-worker
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:latest

      - name: Trigger App Runner deployment
        if: ${{ github.event.inputs.cloud == 'aws' }}
        run: |
          aws apprunner start-deployment \
            --service-arn ${{ secrets.AWS_APPRUNNER_SERVICE_ARN }}

      # ── Azure path ──────────────────────────────────────────
      - name: Azure login
        if: ${{ github.event.inputs.cloud == 'azure' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        if: ${{ github.event.inputs.cloud == 'azure' }}
        run: az acr login --name ${{ secrets.AZURE_ACR_NAME }}

      - name: Build & push to ACR
        if: ${{ github.event.inputs.cloud == 'azure' }}
        uses: docker/build-push-action@v6
        with:
          context: apps/replay-worker
          push: true
          tags: |
            ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
            ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Update Container App revision
        if: ${{ github.event.inputs.cloud == 'azure' }}
        run: |
          az containerapp update \
            --name flowlens-replay-worker \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
